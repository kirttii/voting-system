<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Voting System</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      background: gray;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Vote Now</h2>

    <input type="text" id="roll" placeholder="Enter Roll Number">

    <div>
      <label><input type="radio" name="vote" value="Party A"> Party A</label><br>
      <label><input type="radio" name="vote" value="Party B"> Party B</label><br>
      <label><input type="radio" name="vote" value="Party C"> Party C</label>
    </div>

    <!-- IMPORTANT -->
    <button type="button" onclick="submitVote()">Submit Vote</button>

    <p id="status"></p>
  </div>

  <!-- LINK JS HERE (VERY IMPORTANT) -->
  <script src="script.js"></script>

</body>
</html>
