<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voting System</title>

  <!-- IMPORTANT: match exact filename -->
  <link rel="stylesheet" href="Style.css">
</head>

<body>

  <h1>🗳️ Cast Your Vote</h1>

  <!-- Roll Number -->
  <input type="text" id="roll" placeholder="Enter Roll Number">

  <!-- Voting Cards -->
  <form>

    <label>
      <input type="radio" name="vote" value="Yuva Swaraj">
      <div class="card">
        <img src="images/yuva_swaraj.png" class="logo">
        <span>Yuva Swaraj</span>
      </div>
    </label>

    <label>
      <input type="radio" name="vote" value="Janta Pragati Party">
      <div class="card">
        <img src="images/janta_pragati.png" class="logo">
        <span>Janta Pragati Party</span>
      </div>
    </label>

    <label>
      <input type="radio" name="vote" value="Baddie Navnirman Sena">
      <div class="card">
        <img src="images/baddie_navnirman.png" class="logo">
        <span>Baddie Navnirman Sena</span>
      </div>
    </label>

    <label>
      <input type="radio" name="vote" value="Nav Yuva Party">
      <div class="card">
        <img src="images/nav_yuva.png" class="logo">
        <span>Nav Yuva Party</span>
      </div>
    </label>

  </form>

  <!-- Button -->
  <button onclick="submitVote()">Submit Vote</button>

  <!-- Status -->
  <p id="status"></p>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
